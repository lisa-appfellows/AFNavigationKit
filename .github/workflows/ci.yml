name: Swift Package CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  test-package:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build Package
        run: swift build

      - name: Run Tests
        run: swift test
