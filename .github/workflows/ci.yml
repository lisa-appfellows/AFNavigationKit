name: Swift Package CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]
  # Allows you to manually trigger this workflow from the GitHub Actions tab
  workflow_dispatch:

jobs:
  test-package:
    # Use macOS to test both Apple platforms and Linux compatibility
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Use Swift CLI to download and build all package dependencies
      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build and Test iOS Package
        run: |
          xcodebuild test \
            -scheme AFNavigationKit \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -verbose
