name: Swift Package CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-package:
    # Use macOS to test both Apple platforms and Linux compatibility
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Use Swift CLI to download and build all package dependencies
      - name: Resolve Dependencies
        run: swift package resolve

      # Step 3: Compile the package targets
      - name: Build Package
        run: swift build -v

      # Step 4: Run all Package tests
      - name: Run Tests
        run: swift test -v
