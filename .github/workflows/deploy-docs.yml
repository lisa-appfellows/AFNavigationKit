name: Deploy Swift DocC to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}documentation/${{ steps.repo-name.outputs.lowercase_name }}/
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      # Safely captures both the original and lowercase repository name for URLs
      - name: Retrieve Repository Name
        id: repo-name
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          LOWERSMITH=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          echo "name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "lowercase_name=$LOWERSMITH" >> $GITHUB_OUTPUT

      - name: Generate Static DocC Archive
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path ${{ steps.repo-name.outputs.name }} \
            --output-path ./docs

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

